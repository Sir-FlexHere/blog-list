name: End-to-End Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: blog_list_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d blog_list_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Set up environment file
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env.test
          echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" >> .env.test
          echo "NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}" >> .env.test
          echo "NODE_ENV=test" >> .env.test
          echo "ALLOW_TEST_RESET=true" >> .env.test

      - name: Verify environment setup
        run: |
          echo "Checking .env.test file:"
          cat .env.test | sed 's/=.*/=***/'
          echo ""
          echo "DATABASE_URL secret exists: ${{ secrets.DATABASE_URL != '' }}"
          echo "NEXTAUTH_SECRET secret exists: ${{ secrets.NEXTAUTH_SECRET != '' }}"
          echo "NEXTAUTH_URL secret exists: ${{ secrets.NEXTAUTH_URL != '' }}"
          echo ""
          echo "Checking if DATABASE_URL is loaded from file:"
          if grep -q "DATABASE_URL=" .env.test; then
            echo "✓ DATABASE_URL found in .env.test"
          else
            echo "✗ DATABASE_URL NOT found in .env.test"
          fi

      - name: Run database migrations
        run: npm run db:migrate

      - name: ESLint
        run: npm run lint

      - name: Build production application
        run: npm run build
        env:
          NODE_ENV: production

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Verify production testing endpoint restrictions
        run: npm run test:production

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
